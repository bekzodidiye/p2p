name: Deploy to AWS Lightsail (Self-Hosted)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Native Deploy on AWS Server
    runs-on: self-hosted

    steps:
      - name: Deploy P2P Containers
        run: |
          set -e
          echo "🚀 Navigating to /home/ubuntu/p2p..."
          cd /home/ubuntu/p2p

          echo "📥 Pulling latest changes from main..."
          git fetch origin main
          git reset --hard origin/main

          echo "🐳 Checking environment configuration..."
          if [ ! -f backend/.env ] && [ -f backend/.env.example ]; then
            cp backend/.env.example backend/.env
          fi

          echo "🐳 Building and updating Docker containers..."
          docker compose up -d --build

          echo "🧹 Cleaning up dangling build images..."
          docker image prune -f

          echo "✅ Deployment completed successfully on AWS Lightsail!"
